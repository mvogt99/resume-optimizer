[pytest]
markers =
    llm_required: marks tests that require a running LLM / FTAL harness (deselect with '-m "not llm_required"')
    real_pf: marks tests that need real PersonaForge functions (bypasses conftest PF mock)
    integration: marks tests that need a live external service -- the FTAL gateway,
        ArangoDB, Qdrant, AWS, or another network endpoint. CI has none of these, so
        CI deselects this marker. These tests are still expected to pass LOCALLY
        against a running stack; deselecting is not the same as retiring them.
        Was previously used on 11 tests but never registered here, so it warned and
        deselected nothing (deselect with '-m "not integration"').
