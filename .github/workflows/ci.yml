name: CI

on:
  push:
    branches: [main, feature/**]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download spaCy model
        run: python -m spacy download en_core_web_sm

      - name: Lint
        run: |
          pip install ruff
          ruff check . --exclude tests/ --ignore E501,E402 || true

      - name: Run tests
        env:
          CLOUDLIFT_ENV: local
          PYTHONPATH: .
        run: pytest tests/ -v --tb=short -q --ignore=tests/test_live_smart_llm.py --ignore=tests/test_bedrock_integration.py

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t resume-optimizer-api:ci ./backend

      - name: Smoke test container
        run: |
          docker run -d --name test-api -p 5001:5000 \
            -e CLOUDLIFT_ENV=local \
            -e FLASK_DEBUG=0 \
            resume-optimizer-api:ci
          sleep 15
          curl -f http://localhost:5001/api/agents/status || (docker logs test-api && exit 1)
          docker stop test-api
