name: CI

on:
  push:
    branches: [main, feature/**]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # models.py::init_db() RAISES unless DATABASE_URL is a postgresql:// URL --
    # SQLite support was removed. Without this service every test that touches
    # the database fails, surfacing as KeyError: 'token' when the auth fixture
    # cannot register a user.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ro_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download spaCy model
        run: python -m spacy download en_core_web_sm

      # nlp_engine.py downloads these lazily on first use, which is unreliable
      # in CI and surfaces as LookupError deep inside tests rather than as a
      # setup failure. Fetch them explicitly, the same way spaCy's model is.
      - name: Download NLTK corpora
        run: python -c "import nltk; [nltk.download(p) for p in ('punkt','punkt_tab','stopwords','averaged_perceptron_tagger','averaged_perceptron_tagger_eng','wordnet','omw-1.4')]"

      - name: Lint
        run: |
          pip install ruff
          ruff check . --exclude tests/ --ignore E501,E402 || true

      - name: Run tests
        env:
          CLOUDLIFT_ENV: local
          PYTHONPATH: .
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ro_ci
        # Deselect tests that need a live external service. CI has no GPU, no
        # FTAL harness, no ArangoDB and no Qdrant, so these can never pass here.
        # They are NOT retired -- they still run locally against a real stack.
        # CI saying nothing about a test it cannot run beats failing it forever.
        run: pytest tests/ -v --tb=short -q -m "not integration and not llm_required" --ignore=tests/test_live_smart_llm.py --ignore=tests/test_bedrock_integration.py

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t resume-optimizer-api:ci ./backend

      - name: Smoke test container
        run: |
          docker run -d --name test-api -p 5001:5000 \
            -e CLOUDLIFT_ENV=local \
            -e FLASK_DEBUG=0 \
            resume-optimizer-api:ci
          sleep 15
          curl -f http://localhost:5001/api/agents/status || (docker logs test-api && exit 1)
          docker stop test-api
