# AWS test environment — backend uses live AWS services (RDS, OpenSearch, DynamoDB, SQS, Bedrock)
# Credentials sourced from ~/.aws (host mount — no secrets in this file)
#
# Usage:
#   docker compose -f docker-compose.aws.yml up --build
#
# URLs:
#   API:      http://localhost:5001/api/
#   Frontend: http://localhost:3001
services:
  backend:
    build: ./backend
    container_name: ro-backend-aws
    ports:
      - "127.0.0.1:5001:5000"
    environment:
      - CLOUDLIFT_ENV=aws
      - AWS_REGION=us-east-1
      - RDS_SECRET_ARN=ro/test/db
      - OPENSEARCH_ENDPOINT=search-ro-test-search-ehfgx2y52dkbljroul72wu7uty.us-east-1.es.amazonaws.com
      - OPENSEARCH_SECRET_ARN=ro/test/opensearch
      - DYNAMODB_GRAPH_TABLE=ro-test-graph
      - RO_ENV=test
      - FLASK_DEBUG=0
      - CORS_ORIGINS=http://localhost:3001,http://localhost:5001
    volumes:
      - ~/.aws:/root/.aws:ro
      - ro-aws-db:/app/data
      - ro-aws-uploads:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    image: nginx:alpine
    container_name: ro-frontend-aws
    ports:
      - "127.0.0.1:3001:80"
    volumes:
      - ./frontend/build:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ro-aws-db:
  ro-aws-uploads:
